name: Deploy frontend

# Deploys only after CI has passed on main, so a red build never reaches
# production. Vercel's own Git integration would deploy on every push
# regardless — if you enable that, disable this workflow to avoid double
# deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  vercel:
    name: Vercel production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        # These are inlined at build time, so they must be present here and not
        # merely set on the Vercel project. An absent VITE_BOT_USERNAME does not
        # fail the build — invites just fall back to copying the table code.
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_BOT_USERNAME: ${{ secrets.VITE_BOT_USERNAME }}
          VITE_MINIAPP_NAME: ${{ secrets.VITE_MINIAPP_NAME }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
