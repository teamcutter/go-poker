services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petly
      POSTGRES_PASSWORD: petly
      POSTGRES_DB: petly
    ports:
      - "5432:5432"
    volumes:
      - petly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petly -d petly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://petly:petly@postgres:5432/petly?sslmode=disable
      REDIS_ADDR: redis:6379
      APP_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  petly_pg: