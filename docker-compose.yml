services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-go_poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-go_poker}
      POSTGRES_DB: ${POSTGRES_DB:-go_poker}
    ports:
      - "5432:5432"
    volumes:
      - go_poker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-go_poker} -d $${POSTGRES_DB:-go_poker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      ENV: ${ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://go_poker:go_poker@postgres:5432/go_poker?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      APP_URL: ${APP_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  go_poker_pg: