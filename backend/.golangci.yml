version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        # Go files in this repo are intentionally comment-free.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # Tests deliberately ignore returns and compare sentinels directly.
      - path: _test\.go
        linters:
          - errcheck
          - errorlint

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
